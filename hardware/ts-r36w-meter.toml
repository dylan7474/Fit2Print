id = "ts-r36w-meter"
name = "TS-R36W panel meter (500 uA, no backlight, solder tabs)"
category = "meter"
sources = []
retrieved = "2026-10-30"
note = "Taken from the Phonosphere project's model (the meter holder's pocket fitted 'nice and tight' on the printed test, 2026-10-18). No manufacturer drawing was found, so these are NOT sourced: measure them."

[dim.case_side]
value = 40.0
unit = "mm"
basis = "notes"
source = "Phonosphere model parameters (mtr_sq)"
critical = true

[dim.case_depth]
value = 9.0
unit = "mm"
basis = "notes"
source = "Phonosphere model parameters (mtr_sq_t)"
critical = true

[dim.front_diameter]
value = 36.0
unit = "mm"
basis = "notes"
source = "Phonosphere model parameters (mtr_front_d): the round front"
critical = true

[dim.front_proud]
value = 4.5
unit = "mm"
basis = "notes"
source = "Phonosphere model parameters (mtr_front_t)"
critical = true

[dim.block_width]
value = 17.0
unit = "mm"
basis = "notes"
source = "Phonosphere notes (a 17 x 18 mm block on the back): measure"
critical = false

[dim.block_height]
value = 18.0
unit = "mm"
basis = "notes"
source = "Phonosphere notes (a 17 x 18 mm block on the back): measure"
critical = false

[dim.block_depth]
value = 14.5
unit = "mm"
basis = "notes"
source = "Phonosphere notes (the block is 14.5 mm deep): measure"
critical = false

[dim.block_offset]
value = -9.0
unit = "mm"
basis = "estimate"
source = "Phonosphere notes say the block is 'in the lower half'; this is a guess at how far below the centre: measure"
critical = false

[shape]
note = "Outline only, in the meter's own frame: the front face of the square case is z = 0, the round front stands out in front of it and the block goes behind. Unverified until measured."

[[shape.part]]
name = "case"
label = "Case"
colour = "#9FB3C8"
type = "box"
at = ["-case_side/2", "-case_side/2", "-case_depth"]
size = ["case_side", "case_side", "case_depth"]

[[shape.part]]
name = "front"
label = "Round front"
colour = "#4A4A4A"
type = "cyl"
at = [0, 0, 0]
d = "front_diameter"
h = "front_proud"

[[shape.part]]
name = "block"
label = "Back block"
colour = "#8A8A8A"
type = "box"
at = ["-block_width/2", "block_offset-block_height/2", "-case_depth-block_depth"]
size = ["block_width", "block_height", "block_depth"]
